name: auth
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Paste the code from Safari"
        required: true
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Get refresh token
        env:
          YCID: ${{ secrets.YCID }}
          YSEC: ${{ secrets.YSEC }}
          CODE: ${{ github.event.inputs.code }}
        run: |
          python3 - <<'EOF'
          import os, base64, urllib.parse, urllib.request, json
          cid = os.environ["YCID"]
          sec = os.environ["YSEC"]
          code = os.environ["CODE"].strip()
          auth = base64.b64encode(f"{cid}:{sec}".encode()).decode()
          data = urllib.parse.urlencode({
              "grant_type": "authorization_code",
              "redirect_uri": "https://localhost/",
              "code": code,
          }).encode()
          req = urllib.request.Request(
              "https://api.login.yahoo.com/oauth2/get_token",
              data=data,
              headers={
                  "Authorization": f"Basic {auth}",
                  "Content-Type": "application/x-www-form-urlencoded",
              },
          )
          resp = json.load(urllib.request.urlopen(req))
          print("\n\nCOPY THE LINE BELOW INTO SECRET YTOK\n")
          print(resp["refresh_token"])
          print("\nEND\n")
          EOF
